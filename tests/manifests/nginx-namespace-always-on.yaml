apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginx-namespace-always-on
  name: nginx-namespace-always-on
  namespace: nginx-namespace-always-on
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-namespace-always-on
  template:
    metadata:
      labels:
        app: nginx-namespace-always-on
    spec:
      containers:
        - image: nginx:alpine-slim
          name: nginx-namespace-always-on
          imagePullPolicy: IfNotPresent
